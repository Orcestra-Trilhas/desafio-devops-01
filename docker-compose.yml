services:
  desafio:
    build: .
    container_name: desafio-devops-01
    ports:
      - "8058:8058"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./workspace:/workspace
    stdin_open: true
    tty: true
    environment:
      - WORKSPACE_DIR=/workspace
      - PORT=8058
      - TERM=xterm-256color
