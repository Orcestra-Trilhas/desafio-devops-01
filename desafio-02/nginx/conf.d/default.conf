# ==============================================================================
# CONFIGURAÇÃO DE ROTEAMENTO & PROXY REVERSO (NGINX)
# ==============================================================================

upstream api_servers {
    # ATENÇÃO: Verificar os endereços e portas dos nós da aplicação
    server api-node-1:8080;
    server api-node-2:80;
}

# Bloco HTTP (Porta 80)
server {
    listen 80;
    server_name localhost;

    # PROBLEMA: Requisições HTTP não estão sendo redirecionadas para HTTPS!
    location / {
        proxy_pass http://api_servers;
    }
}

# Bloco HTTPS (Porta 443)
server {
    listen 443 ssl;
    server_name localhost;

    # PROBLEMA: Os arquivos de certificado configurados abaixo não correspondem
    # aos gerados pelo script de certificados (/etc/nginx/certs/server.crt e server.key)
    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://api_servers;

        # PROBLEMA: Faltam cabeçalhos essenciais de proxy reverso e cabeçalhos de segurança:
        # - Host
        # - X-Real-IP
        # - X-Forwarded-For
        # - X-Forwarded-Proto
        # - X-Frame-Options
        # - X-Content-Type-Options
    }

    # Endpoint de verificação de integridade do próprio Nginx
    location /healthz {
        access_log off;
        return 200 "{\"status\":\"healthy\",\"service\":\"nginx-proxy\"}\n";
        default_type application/json;
    }
}
