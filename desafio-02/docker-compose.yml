services:
  # ============================================================================
  # 1. PROXY REVERSO E TERMINAÇÃO SSL (NGINX)
  # ============================================================================
  proxy:
    image: nginx:alpine
    container_name: devops-proxy
    restart: unless-stopped
    ports:
      - "${APP_PORT_HTTP:-80}:80"
      - "${APP_PORT_HTTPS:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    # PROBLEMA: O container proxy só está na rede pública!
    # Não consegue comunicar com os nós da aplicação que estão na rede interna.
    networks:
      - public_net
    depends_on:
      - api-node-1
      - api-node-2

  # ============================================================================
  # 2. UPSTREAM NODES (SERVIÇOS DE APLICAÇÃO - NGINX ESTÁTICO DE BAIXA LATÊNCIA)
  # ============================================================================
  api-node-1:
    image: nginx:alpine
    container_name: devops-api-node-1
    restart: unless-stopped
    volumes:
      - ./upstreams/node1/index.html:/usr/share/nginx/html/index.html:ro
    networks:
      - internal_net
    depends_on:
      - database
      - cache

  api-node-2:
    image: nginx:alpine
    container_name: devops-api-node-2
    restart: unless-stopped
    volumes:
      - ./upstreams/node2/index.html:/usr/share/nginx/html/index.html:ro
    networks:
      - internal_net
    depends_on:
      - database
      - cache

  # ============================================================================
  # 3. BANCO DE DADOS (POSTGRESQL 16)
  # ============================================================================
  database:
    image: postgres:16-alpine
    container_name: devops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # PROBLEMA: O caminho padrão dos dados no PostgreSQL é /var/lib/postgresql/data
      - db_data:/var/lib/postgresql
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - internal_net
    # PROBLEMA: O comando curl não existe na imagem do Postgres e a porta 5432 não é HTTP!
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5432"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # ============================================================================
  # 4. CAMADA DE CACHE (REDIS 7)
  # ============================================================================
  cache:
    image: redis:7-alpine
    container_name: devops-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - cache_data:/data
    networks:
      - internal_net
    # PROBLEMA: Healthcheck configurado com comando incorreto
    healthcheck:
      test: ["CMD", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

networks:
  public_net:
    driver: bridge
  internal_net:
    driver: bridge

volumes:
  db_data:
  cache_data:
